[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "RAG pipeline over the vLLM 0.10.1 corpus for the 42 'RAG against the machine' project."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fire>=0.6.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "flake8-pyproject>=1.2.3",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.flake8]
max-line-length = 100
